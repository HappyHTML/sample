<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Celestial Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-mode">
    <div id="custom-cursor"></div>
    <div id="cursor-trail"></div>
    <div id="transition-overlay"></div>

    <div class="background-layers">
        <canvas id="nebula-canvas"></canvas>
        <div class="aurora"></div>
        <div id="debris-container"></div>
        <div class="parallax-stars"></div>
    </div>

    <main class="ui-overlay">
        <div class="portal-card">
            <header>
                <h1 id="mode-text">SOLAR MODE</h1>
                <div class="badge-container">
                    <span class="active-badge">ACTIVE DIMENSION</span>
                </div>
            </header>

            <div class="spatial-divider">
                <div class="line"></div>
                <div class="orbit"></div>
                <div class="line"></div>
            </div>

            <div class="control-center">
                <div class="toggle-wrapper">
                    <span class="dimension-label">SOLAR</span>
                    <button id="theme-portal" aria-label="Toggle Dimension">
                        <div class="portal-disc">
                            <div class="celestial-body sun"></div>
                            <div class="celestial-body moon">
                                <div class="crater c1"></div>
                                <div class="crater c2"></div>
                                <div class="crater c3"></div>
                            </div>
                        </div>
                        <div class="portal-rings">
                            <div class="ring r1"></div>
                            <div class="ring r2"></div>
                        </div>
                    </button>
                    <span class="dimension-label">LUNAR</span>
                </div>
            </div>

            <footer>
                <p class="coordinates">X: <span id="coord-x">0000</span> | Y: <span id="coord-y">0000</span></p>
            </footer>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
